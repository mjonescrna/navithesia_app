name: navithesia_beta
description: "A mobile application for Student Registered Nurse Anesthetists (SRNAs) to track and manage their clinical experience requirements as defined by the Council on Accreditation (COA)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # State management
  provider: ^6.0.5
  
  # Local storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.2
  path_provider: ^2.1.1
  
  # Date & Time formatting
  intl: ^0.17.0
  
  # UI components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.65.0
  
  # Authentication
  local_auth: ^2.1.8
  
  # OCR capabilities
  google_mlkit_text_recognition: ^0.11.0
  image_picker: ^1.0.5
  
  # PDF creation and sharing
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^7.2.2
  
  # Location services for Goals page
  geolocator: ^10.1.1
  geocoding: ^2.2.2
  
  # Hospital search
  flutter_typeahead: ^4.8.0
  http: ^1.1.0

  # Utilities
  uuid: ^4.3.3
  
  # Keyboard visibility
  flutter_keyboard_visibility: ^5.4.1
  
  # Firebase - real implementation
  firebase_core: ^2.14.0
  firebase_auth: ^4.6.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/clinical_experience_database_clean.json
    - assets/clinical_experience_database_clean_updated.json
    - assets/coa_schools.json 